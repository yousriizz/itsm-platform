name: Tests API

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_dev_only
          POSTGRES_DB: itsm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://itsm:itsm_dev_only@127.0.0.1:5433/itsm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_app
